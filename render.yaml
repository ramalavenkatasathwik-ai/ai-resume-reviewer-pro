services:
  # Frontend Static Site (React 18 + Vite SPA)
  - type: web
    name: ai-resume-reviewer-frontend
    runtime: static
    region: oregon
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self';"
    envVars:
      - key: VITE_API_URL
        value: https://ai-resume-reviewer-backend.onrender.com

  # Backend Web Service (FastAPI)
  - type: web
    name: ai-resume-reviewer-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: ai-resume-reviewer-api
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-reviewer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-resume-reviewer-frontend.onrender.com
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-argon
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: storage/private
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: "15"

databases:
  # PostgreSQL Database
  - name: ai-resume-reviewer-db
    databaseName: resume_reviewer
    user: resume_admin
    region: oregon
    plan: free
    ipAllowList: []
