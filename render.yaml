services:
  # Backend Web Service (FastAPI)
  - type: web
    name: ai-resume-reviewer-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: ai-resume-reviewer-api
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-reviewer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: storage/private
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: "15"

databases:
  # PostgreSQL Database
  - name: ai-resume-reviewer-db
    databaseName: resume_reviewer
    user: resume_admin
    region: oregon
    plan: free
    ipAllowList: []
